spring.application.name=student_management

server.port=8080

server.error.include-binding-errors=always
server.error.include-message=always
server.error.include-stacktrace=never

spring.datasource.url=jdbc:postgresql://localhost:5432/368_backend_project
spring.datasource.username=techpront
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

logging.file.name=log/studentmanagementapp.log
logging.pattern.file="%d %-5level [%thread] %logger:%msg%n"

logging.level.org.springframework.web=WARN
logging.level.org.hibernate=INFO
logging.level.com.tpe=INFO

backendapi.app.jwtSecret=${JWT_SECRET}
backendapi.app.refreshTokenExpiration=60480000
backendapi.app.accessTokenExpiration=900000

variable.midterm_impact_percentage=0.40
variable.final_impact_percentage=0.60